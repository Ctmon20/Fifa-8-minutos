<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Confrontos</title>
    <style>
        :root {
            --bg-color: #fdfaf7;
            --card-bg: #ffffff;
            --text-color: #333;
            --accent: #28a745;
            --sugestao-color: #d32f2f; /* Vermelho no tema claro */
        }
        body.dark {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --sugestao-color: #ffeb3b; /* Amarelo no tema escuro */
        }
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: var(--bg-color); color: var(--text-color); transition: 0.3s; }
        .controls { background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid rgba(0,0,0,0.05); }
        select, button { padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
        button { background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; }
        #sugestao { font-weight: bold; margin-left: 10px; font-size: 14px; color: var(--sugestao-color); }
        .grid-columns { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        @media (max-width: 600px) { .controls { flex-direction: column; } }
    </style>
</head>
<body>

<div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Analisador de Confrontos</h2>
    <button onclick="document.body.classList.toggle('dark')">🌓 Alternar Tema</button>
</div>

<div class="controls">
    <select id="jogadorA"></select> vs <select id="jogadorB"></select>
    <button onclick="analisar()">Analisar Confrontos</button>
    <span id="sugestao"></span>
</div>

<div id="resultado" class="stats"></div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbzAri6f7qVBB22ruVrYdBbxt3RyEaEN-k6VZ2Gzzb7iYNWSrgROODMEzbqSTmh47Ts/exec";
    let dadosGlobais = [];

    fetch(URL)
        .then(r => r.json())
        .then(data => {
            dadosGlobais = data.confrontos;
            const nomes = [...new Set([...dadosGlobais.map(d => d.casa), ...dadosGlobais.map(d => d.visit)])].sort();
            document.getElementById('jogadorA').innerHTML = document.getElementById('jogadorB').innerHTML = nomes.map(n => `<option value="${n}">${n}</option>`).join('');
        });

    function analisar() {
        const A = document.getElementById('jogadorA').value;
        const B = document.getElementById('jogadorB').value;
        const confrontos = dadosGlobais.filter(d => (d.casa === A && d.visit === B) || (d.casa === B && d.visit === A));
        
        if (confrontos.length === 0) { document.getElementById('resultado').innerHTML = "Nenhum confronto encontrado."; return; }

        let gA = 0, gB = 0;
        let vA = 0, vB = 0, empates = 0;
        let ambasMarcamCount = 0;
        let counts = { jogo: Array(8).fill(0), jogA: Array(8).fill(0), jogB: Array(8).fill(0) };

        confrontos.forEach(c => {
            let golsA = (c.casa === A) ? c.golsCasa : c.golsVisit;
            let golsB = (c.casa === A) ? c.golsVisit : c.golsCasa;
            gA += golsA; gB += golsB;
            
            if (golsA > golsB) vA++;
            else if (golsB > golsA) vB++;
            else empates++;

            if (golsA > 0 && golsB > 0) ambasMarcamCount++;

            for (let i = 0; i < 8; i++) {
                if ((golsA + golsB) >= (i + 0.5)) counts.jogo[i]++;
                if (golsA >= (i + 0.5)) counts.jogA[i]++;
                if (golsB >= (i + 0.5)) counts.jogB[i]++;
            }
        });

        const total = confrontos.length;
        const sugestaoEl = document.getElementById('sugestao');
        if (vA > vB) sugestaoEl.innerHTML = `Sugestão: Vitória de ${A} com ${((vA/total)*100).toFixed(0)}% de chence`;
        else if (vB > vA) sugestaoEl.innerHTML = `Sugestão: Vitória de ${B} com ${((vB/total)*100).toFixed(0)}% de chence`;
        else sugestaoEl.innerHTML = "Sugestão: Tendência a Empate";

        const pAmbas = ((ambasMarcamCount / total) * 100).toFixed(0);
        
        const renderBar = (count, total, label) => {
            const p = ((count / total) * 100).toFixed(0);
            const color = p >= 80 ? '#28a745' : '#dc3545';
            return `<div style="display:flex; align-items:center; gap:8px; margin: 5px 0; font-size:12px;">
                        <span style="min-width:45px;">${label}</span>
                        <div style="background:#ddd; height:10px; width:100%; border-radius:5px; overflow:hidden;">
                            <div style="background:${color}; height:100%; width:${p}%;"></div>
                        </div>
                        <span style="min-width:35px; text-align:right;">${p}%</span>
                    </div>`;
        };

        document.getElementById('resultado').innerHTML = `
            <div class="card">Total: <b>${total}</b></div>
            <div class="card">Vitórias ${A}: <b>${vA}</b></div>
            <div class="card">Vitórias ${B}: <b>${vB}</b></div>
            <div class="card">Empates: <b>${empates}</b></div>
            <div class="card">Média Gols: <b>${((gA + gB) / total).toFixed(2)}</b></div>
            <div class="card">Ambas Marcam: <b>${pAmbas}%</b></div>
            <div class="card">Média ${A}: <b>${(gA / total).toFixed(2)}</b></div>
            <div class="card">Média ${B}: <b>${(gB / total).toFixed(2)}</b></div>
            <div class="card grid-columns">
                <div style="padding-right:10px;"><h3>GOLS NO JOGO</h3>${counts.jogo.map((c, i) => renderBar(c, total, (i+0.5)+' Gols')).join('')}</div>
                <div style="padding-right:10px;"><h3>JOGADOR ${A}</h3>${counts.jogA.map((c, i) => renderBar(c, total, (i+0.5)+' Gols')).join('')}</div>
                <div><h3>JOGADOR ${B}</h3>${counts.jogB.map((c, i) => renderBar(c, total, (i+0.5)+' Gols')).join('')}</div>
            </div>
        `;
    }
</script>
</body>
</html>
