<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner 8 Minutos - Pagamento</title>
    <!-- Adicionando a biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1a1a1a;
            --input-bg: #2a2a2a;
            --text-color: #ffffff;
            --accent-green: #6d9c00;
            --disabled-color: #444444;
            --brand-orange: #ff8c00;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .payment-card {
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid var(--brand-orange);
        }
        h2 { margin-bottom: 5px; margin-top: 0px; }
        .price { color: #ff8c00; font-size: 1.2em; margin-bottom: 10px; }
        .form-group { text-align: left; margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        input {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--brand-orange);
            border-radius: 8px;
            color: white;
            box-sizing: border-box; 
        }
        input:focus { outline: 1px solid var(--accent-green); }
        #btn-pagar {
            width: 100%;
            padding: 12px;
            background-color: var(--disabled-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: not-allowed;
            margin-top: 10px;
            transition: 0.3s;
        }
        #btn-pagar.active {
            background-color: var(--accent-green);
            cursor: pointer;
        }
        .security-footer {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .logo-imagem {
            max-width: 300px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 0px auto;
        }
    </style>
</head>
<body>

<div class="payment-card">
    <img src="logo.png" alt="Scanner 8 Minutos" class="logo-imagem">
    <h2>Assinatura</h2>
    <div class="price">Plano Mensal — <b>R$ 39,90</b> / 30 dias</div>
    <p style="font-size: 0.75em; color: #888; margin-top: 10px; font-style: italic;">
        Após o pagamento, o acesso a todos os dados será liberado em cerca de 10 minutos, podendo ocorrer antes. 
    </p>
    <form id="paymentForm">
        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="nome" placeholder="Seu nome completo" maxlength="60" required>
        </div>

        <div class="form-group">
            <label>CPF (apenas números)</label>
            <input type="text" id="cpf" placeholder="00000000000" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
        </div>

        <div class="form-group">
            <label>E-mail (deve ser o mesmo do cadastro)</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
            <label>Telefone / WhatsApp (com DDD)</label>
            <input type="tel" id="telefone" placeholder="11999999999" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
        </div>
        <button type="button" id="btn-pagar" disabled onclick="realizarPagamento()">Pagar via Mercado Pago</button>
    </form>
    <div class="security-footer">
        🔒 Pagamento 100% seguro via Mercado Pago
    </div>
</div>


<script>
    // 1. Configurações
    const supabaseUrl = 'https://afezbragrjyovmgwjmeq.supabase.co';
    const supabaseAnonKey = 'sb_publishable_FICkQvqGT4az5kAmUnpLww_oKlVLlqD';

    // 2. Inicialização correta (extraímos a função createClient do objeto supabase global)
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseAnonKey);

    const form = document.getElementById('paymentForm');
    const inputs = form.querySelectorAll('input');
    const btnPagar = document.getElementById('btn-pagar');

    // 3. Função de validação
    function validateForm() {
        let allFilled = true;
        inputs.forEach(input => {
            if (input.value.trim() === '') {
                allFilled = false;
            }
        });

        if (allFilled) {
            btnPagar.disabled = false;
            btnPagar.classList.add('active');
        } else {
            btnPagar.disabled = true;
            btnPagar.classList.remove('active');
        }
    }

// 4. Função de envio com validações de limite e formato
    async function realizarPagamento() {
        if (btnPagar.disabled) return;

        // --- Validações de Segurança ---
        const nome = document.getElementById('nome').value.trim();
        const cpf = document.getElementById('cpf').value.trim();
        const email = document.getElementById('email').value.trim();
        const telefone = document.getElementById('telefone').value.trim();

        // Regex para validar formato de e-mail genérico
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (nome.length < 3) {
            alert("Por favor, digite seu nome completo.");
            return;
        }
        if (cpf.length !== 11) {
            alert("CPF inválido! O campo deve conter exatamente 11 números.");
            return;
        }
        if (!emailRegex.test(email)) {
            alert("E-mail inválido! Certifique-se de incluir @ e o domínio (ex: .com, .br).");
            return;
        }
        if (telefone.length < 10 || telefone.length > 11) {
            alert("Telefone inválido! Inclua o DDD + número (10 a 11 dígitos).");
            return;
        }

        // --- Processamento ---
        btnPagar.innerText = "Salvando...";
        btnPagar.disabled = true;

        const { error } = await supabaseClient
            .from('pagamentos')
            .insert([{
                nome: nome,
                cpf: cpf,
                email: email,
                telefone: telefone
            }]);

        if (error) {
            console.error("Erro Supabase:", error);
            alert("Erro ao salvar dados. Tente novamente.");
            btnPagar.innerText = "Pagar via Mercado Pago";
            btnPagar.disabled = false;
        } else {
            window.location.href = "https://mpago.la/1gath2F";
        }
    }

    // 5. Listener (Mantido igual)
    inputs.forEach(input => {
        input.addEventListener('input', validateForm);
    });
</script>

</body>
</html>
